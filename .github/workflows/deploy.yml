name: Build & Deploy MediMind to AWS ECS

on:
  push:
    branches:
      - main
      - master
      - development
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 468997136367.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: medtrack-development-cluster

jobs:
  build-and-deploy:
    name: Build Docker Images, Apply Terraform & Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # Run automated verification, S3 backend setup, Terraform infra, Docker builds & ECS deployment
      - name: Run Validation & Deployment Script
        working-directory: ./terraform
        env:
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_qwen_api_key: ${{ secrets.QWEN_API_KEY }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
          TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          chmod +x ./validate_deployment.sh
          ./validate_deployment.sh

      # Standalone Automated Database Seeding via ECS Run-Task
      - name: Seed Database on AWS ECS
        run: |
          echo "Extracting network configuration & active task definition from backend service..."
          TASK_DEF_ARN=$(aws ecs describe-services --cluster medtrack-development-cluster --services medtrack-development-backend-service --query "services[0].taskDefinition" --output text)
          SUBNETS=$(aws ecs describe-services --cluster medtrack-development-cluster --services medtrack-development-backend-service --query "services[0].networkConfiguration.awsvpcConfiguration.subnets" --output json | jq -c '.')
          SGS=$(aws ecs describe-services --cluster medtrack-development-cluster --services medtrack-development-backend-service --query "services[0].networkConfiguration.awsvpcConfiguration.securityGroups" --output json | jq -c '.')

          echo "Running standalone database seed task ($TASK_DEF_ARN) on ECS Fargate..."
          aws ecs run-task \
            --cluster medtrack-development-cluster \
            --task-definition $TASK_DEF_ARN \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=$SUBNETS,securityGroups=$SGS,assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["node","src/seed.js"]}]}' \
            --no-cli-pager

          echo "Database seed task launched successfully!"
